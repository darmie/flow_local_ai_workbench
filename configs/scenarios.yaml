# Synthetic serving workloads, each mapped to an SMB use case. All use
# `vllm bench serve` against /v1/completions with fixed lengths (range ratio 0)
# and --ignore-eos, so every machine processes exactly the same token counts.
#
# slo: per-request thresholds passed to --goodput. A request "meets SLO" only
# if every listed metric is under its limit. Capacity (max users) is derived
# from these; see docs/METHODOLOGY.md §6.

scenarios:
  chat:
    use_case: "Interactive assistant turn"
    dataset: random
    input_len: 512
    output_len: 256
    slo: {ttft: 2000, tpot: 150}

  rag:
    use_case: "Question over retrieved documents (prefill-heavy)"
    dataset: random
    input_len: 3072
    output_len: 256
    slo: {ttft: 5000, tpot: 150}

  generate:
    use_case: "Drafting a long answer/report (decode-heavy)"
    dataset: random
    input_len: 128
    output_len: 1024
    slo: {ttft: 2000, tpot: 150}

  agent-prefix:
    use_case: "Agent steps sharing a long system prompt + tool schemas"
    dataset: prefix_repetition
    prefix_len: 2048
    suffix_len: 256
    num_prefixes: 4
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  longctx:
    use_case: "Long document analysis; skipped when max_model_len < 16384"
    dataset: random
    input_len: 12288
    output_len: 256
    min_model_len: 16384
    slo: {ttft: 15000, tpot: 200}


  # Phase 2: identical FLORES+ passages (8 sentences) in each language; input
  # length differs only by the tokenizer's fertility. Build with harness/flores.py.
  flores-eng:
    use_case: "English (reference) passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/eng_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-swh:
    use_case: "Swahili passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/swh_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-yor:
    use_case: "Yoruba passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/yor_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-hau:
    use_case: "Hausa passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/hau_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-ibo:
    use_case: "Igbo passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/ibo_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-zul:
    use_case: "isiZulu passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/zul_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

  flores-xho:
    use_case: "isiXhosa passage, same meaning as every flores-* scenario"
    dataset: custom
    dataset_path: datasets/flores/xho_Latn.jsonl
    input_len_hint: 1024
    output_len: 128
    slo: {ttft: 3000, tpot: 150}

default_scenarios: [chat, rag, generate, agent-prefix]

groups:
  flores: [flores-eng, flores-swh, flores-yor, flores-hau, flores-ibo, flores-zul, flores-xho]
