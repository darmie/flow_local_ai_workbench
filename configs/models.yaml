# Model matrix. Keys are the names used on the command line and in results.
# `hf` is the exact checkpoint; pin `revision` once a model is adopted so every
# machine benchmarks identical weights.
#
# Cross-mode (GPU vs CPU) comparisons must use a checkpoint that runs on both
# backends: bf16, AWQ, GPTQ, or INT8 W8A8. FP8 does not run on x86 CPU.

models:
  llama3.2-3b:
    hf: meta-llama/Llama-3.2-3B-Instruct
    quant: bf16
    params_b: 3.2
    tiers: [t1-minimal, t2-entry-dgpu]
    tool_call_parser: llama3_json

  llama3.2-3b-w8a8:
    hf: RedHatAI/Llama-3.2-3B-Instruct-quantized.w8a8
    quant: int8-w8a8
    params_b: 3.2
    tiers: [t1-minimal]
    tool_call_parser: llama3_json

  phi4-mini-ov:
    # OpenVINO backend only (Iris Xe / CPU); not loadable by stock vLLM.
    hf: OpenVINO/Phi-4-mini-instruct-int4-ov
    quant: int4-ov
    params_b: 3.8
    tiers: [t1-minimal]
    platforms: [openvino]

  llama3.1-8b-w4a16:
    hf: RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w4a16
    quant: w4a16
    params_b: 8.0
    tiers: [t1-minimal, t2-entry-dgpu]
    tool_call_parser: llama3_json

  llama3.1-8b-w8a8:
    hf: RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
    quant: int8-w8a8
    params_b: 8.0
    tiers: [t1-minimal, t2-entry-dgpu]
    tool_call_parser: llama3_json

  qwen3-8b-awq:
    hf: Qwen/Qwen3-8B-AWQ
    quant: awq
    params_b: 8.2
    tiers: [t1-minimal, t2-entry-dgpu]
    tool_call_parser: hermes
    reasoning_parser: qwen3

  qwen3-14b-awq:
    hf: Qwen/Qwen3-14B-AWQ
    quant: awq
    params_b: 14.8
    tiers: [t2-entry-dgpu, t3-pro]
    tool_call_parser: hermes
    reasoning_parser: qwen3

  qwen3-32b-awq:
    hf: Qwen/Qwen3-32B-AWQ
    quant: awq
    params_b: 32.8
    tiers: [t3-pro, t4-multi-gpu]
    tool_call_parser: hermes
    reasoning_parser: qwen3

  llama3.3-70b-w4a16:
    hf: RedHatAI/Llama-3.3-70B-Instruct-quantized.w4a16
    quant: w4a16
    params_b: 70.6
    tiers: [t3-pro, t4-multi-gpu]
    tool_call_parser: llama3_json
