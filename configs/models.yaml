# Model matrix. Keys are the names used on the command line and in results.
#
# hf / revision   exact checkpoint and commit; every machine benchmarks identical weights
# gated           needs `hf auth login` and an accepted licence before `hf download`
# max_model_len   cap below the tier's context length (the model's own limit)
# serve_args      extra vLLM flags this model always needs
# chat_template   false for base models without one (bench skips the template)
# mlx             4-bit MLX checkpoint served on Apple Silicon (platform `metal`); same
#                 model family, different quantisation, so compare it only within Apple
# speculator      EAGLE3 draft head used by the `spec-eagle3` profile
# tool_call_parser / reasoning_parser   used by the `agentic` profile (Garden)
#
# Cross-mode (GPU vs CPU) comparisons need a checkpoint that runs on both
# backends: bf16, AWQ, GPTQ or INT8 W8A8. FP8 does not run on x86 CPU.

models:
  # --- 3-4B: minimal tier -------------------------------------------------
  llama3.2-3b:
    hf: meta-llama/Llama-3.2-3B-Instruct
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
    mlx: {hf: mlx-community/Llama-3.2-3B-Instruct-4bit, revision: 7f0dc925e0d0afb0322d96f9255cfddf2ba5636e}
    gated: true
    quant: bf16
    params_b: 3.2
    tiers: [t1-minimal, t2-entry]
    tool_call_parser: llama3_json

  llama3.2-3b-w8a8:
    hf: RedHatAI/Llama-3.2-3B-Instruct-quantized.w8a8
    revision: 505dad2e5ceed6c787249c634a05f2d6cf8ad9e4
    quant: int8-w8a8
    params_b: 3.2
    tiers: [t1-minimal]
    tool_call_parser: llama3_json

  phi4-mini-ov:
    # OpenVINO backend only (Iris Xe / CPU); not loadable by stock vLLM.
    hf: OpenVINO/Phi-4-mini-instruct-int4-ov
    revision: e5813af02e8560a9186c41f932f21cbb584a0907
    quant: int4-ov
    params_b: 3.8
    tiers: [t1-minimal]
    platforms: [openvino]

  phi4-mini-w4a16:
    # No first-party 4-bit Phi-4-mini exists; this is AMD's llm-compressor build.
    hf: amd/Phi-4-mini-instruct-w4a16-llmcompressor
    revision: 9cf2a568ef9d491718ebe32252b2c60d790f6dd3
    mlx: {hf: mlx-community/Phi-4-mini-instruct-4bit, revision: ac1c269cb4222a4e136a3d09edad301056c1f36a}
    quant: w4a16
    params_b: 3.8
    tiers: [t1-minimal, t2-entry]
    status: experimental

  # --- African-language model (Phase 2) ------------------------------------
  inkubalm-0.4b:
    # Base model (no chat template), Llama architecture served natively by vLLM;
    # licence CC BY-NC 4.0. Not usable for Garden (no tool calling).
    hf: lelapa/InkubaLM-0.4B
    revision: 95db0f1342e83a95cd1d891509643e0c436ee88b
    gated: true
    quant: bf16
    params_b: 0.4
    max_model_len: 2048
    chat_template: false
    tiers: [t1-minimal, t2-entry]

